<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AjiraConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#14192b;--mu:#6b7080;--pr:#14213d;--pr2:#1f2f57;--gold:#b8892e;--gold2:#d9b25a;--bd:#e6e0d4;--ok:#1f8a5b;--ontop:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131a2e;--tx:#eef0f6;--mu:#9aa3bd;--pr:#0f1a33;--pr2:#1b2a50;--gold:#d9b25a;--gold2:#f0cf84;--bd:#232d4a;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2e;--tx:#eef0f6;--mu:#9aa3bd;--pr:#0f1a33;--pr2:#1b2a50;--gold:#d9b25a;--gold2:#f0cf84;--bd:#232d4a;--ok:#4ade80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lside{background:linear-gradient(150deg,#0b1430,#1f2f57 60%,#3a2c0f);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}
.lside h1{font-size:2.6rem;line-height:1.15;margin:18px 0 12px}.lside p{color:#c9d0e6;max-width:420px}
.lside .gl{width:56px;height:3px;background:var(--gold2);border-radius:2px}
.lform{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:380px}
.box h2{font-size:1.8rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 22px}
.brand{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.5rem;letter-spacing:.3px}.brand span{color:var(--gold2)}
label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:16px 0 6px;color:var(--mu)}
input[type=email],input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--gold);border-color:transparent}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(184,137,46,.35)}
.btn.full{width:100%;margin-top:22px;padding:14px}
.btn.off{background:var(--bd);color:var(--mu);cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.err{color:#c0392b;font-size:.88rem;margin-top:10px;min-height:1.3em}
/* app */
header{background:var(--pr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 18px rgba(0,0,0,.18)}
.hd{max-width:1080px;margin:auto;display:flex;align-items:center;gap:18px;padding:14px 20px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#c3cae0;padding:9px 16px;border-radius:99px;font:inherit;font-size:.92rem;font-weight:500;cursor:pointer;transition:.2s}
nav button:hover{color:#fff}nav button.on{background:rgba(217,178,90,.18);color:var(--gold2)}
.out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:8px 16px;font:inherit;font-size:.88rem;cursor:pointer}
.out:hover{border-color:var(--gold2);color:var(--gold2)}
main{max-width:1080px;margin:auto;padding:28px 20px 64px}
.ttl{margin:0 0 4px;font-size:2rem}.ttl+p{color:var(--mu);margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(20,33,61,.05)}
.card h3{margin:0 0 14px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--gold)}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:22px;padding:30px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:20px;border:1px solid rgba(217,178,90,.35)}
.av{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;flex:none}
.hero h2{margin:0;font-size:1.9rem}.hero .role{color:var(--gold2);font-weight:500;margin:2px 0 12px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.9rem;color:#d6dbec}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.stack{display:grid;gap:20px}
.item{padding-bottom:14px;margin-bottom:14px;border-bottom:1px dashed var(--bd)}.item:last-child{border:0;margin:0;padding:0}
.item b{display:block}.item small{color:var(--gold);font-weight:600}
ul{margin:8px 0 0;padding-left:18px;color:var(--mu);font-size:.93rem}li{margin:3px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:5px 13px;font-size:.84rem}
.ref{font-size:.92rem;margin-bottom:12px}.ref small{display:block;color:var(--mu)}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* jobs */
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}
.job{display:flex;flex-direction:column;gap:14px}
.jh{display:flex;gap:16px;align-items:center}
.logo{flex:none;width:68px;height:68px;border-radius:22px;overflow:hidden;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.4rem;color:var(--pr)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.job h3{margin:0;font-size:1.2rem}.job h3::before{display:none}.co{color:var(--gold);font-weight:600;font-size:.9rem}
.req{font-size:.9rem;color:var(--mu);flex:1}.req b{color:var(--tx)}
/* applications */
.app{display:grid;gap:22px}
.steps{display:grid;grid-template-columns:repeat(4,1fr)}
.st{text-align:center;font-size:.82rem;color:var(--mu);position:relative;font-weight:500}
.st i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--bd);background:var(--card);font-style:normal;font-weight:700;position:relative;z-index:1}
.st.done{color:var(--tx)}.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st:not(:last-child)::after{content:"";position:absolute;top:16px;left:50%;width:100%;height:2px;background:var(--bd)}
.st.done:not(:last-child)::after{background:var(--ok)}
.badge{display:inline-block;background:rgba(31,138,91,.14);color:var(--ok);border-radius:99px;padding:5px 14px;font-weight:600;font-size:.85rem;margin-left:auto}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr);color:var(--gold2);border:1px solid var(--gold);padding:13px 24px;border-radius:99px;font-weight:600;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.3)}
@media(max-width:860px){#login{grid-template-columns:1fr}.lside{padding:36px 28px}.lside h1{font-size:1.9rem}.cols{grid-template-columns:1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr 1fr;gap:18px 0}.st:nth-child(2)::after{display:none}.hero{padding:22px}.ttl{font-size:1.6rem}.badge{margin-left:0}}
</style>
</head>
<body>

<section id="login">
  <div class="lside">
    <div class="brand">Ajira<span>Connect</span></div>
    <div class="gl" style="margin-top:28px"></div>
    <h1>Your next career move starts here.</h1>
    <p>Discover trusted employers, manage your professional profile and follow every application in one elegant place.</p>
  </div>
  <div class="lform"><div class="box">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your AjiraConnect account.</p>
    <label for="u">Username</label>
    <input id="u" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err" id="err"></div>
    <button class="btn full" id="lbtn">Sign In</button>
  </div></div>
</section>

<div id="app" class="hide">
  <header><div class="hd">
    <div class="brand">Ajira<span>Connect</span></div>
    <nav id="nav">
      <button data-v="profile" class="on">My Profile CV</button>
      <button data-v="jobs">Apply for Jobs</button>
      <button data-v="apps">My Applications</button>
    </nav>
    <button class="out" id="lo">Sign Out</button>
  </div></header>
  <main id="main"></main>
</div>
<div id="toast" class="hide">Deadline reached</div>

<script>
var USER="mosesrahab703@icloud.com",PASS="Mussa2001";
var cvName="CV_RAHAB_M.pdf";
var L={
 smart:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaEyBF7fJd6bmNH8LWmmXlHIaWuOcXBGQQKHdWEFoOZw&s=10",
 equity:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwsGprYt_5uRqDXk_ZiXd1ExPVF8efDnVCbeJSmP18Rw&s",
 gsm:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTtG9dxqGNmtaSTqJJMHF87QAkOIPmCnWP4mqzxENe68w&s",
 fumbo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgtQdAOkvL67R6fCw-EnuWRE6zah8KTdK9Sxd1eg230Q&s=10",
 reco:"https://i.ibb.co/wh4fxW8V/dc6e3c06-c9b0-48e1-aca8-9147f3cfb25b.jpg"
};
var jobs=[
 {l:"smart",m:"SE",t:"Database Intern",c:"Smart EFD",r:"Degree in IT"},
 {l:"equity",m:"EB",t:"Card Registerer",c:"Equity Bank",r:"Strong customer-service skills and attention to detail"},
 {l:"gsm",m:"GS",t:"Marketing Officer",c:"GSM L.T.D",r:"Knowledge of marketing and communication"},
 {l:"fumbo",m:"FI",t:"Treasury Officer",c:"Fumbo Insurance Limited",r:"Degree in Procurement or Accounting & Finance"}
];
var steps=["Submitted","In Progress","Interview Request","Approved"];
var apps=[{l:"reco",m:"RE",c:"Reco Equipments Limited",t:"Stock Officer",loc:"Temeke Branch",r:"Diploma in Accountancy or Business Administration",d:4}];

function logo(k,m){return '<div class="logo"><img src="'+L[k]+'" alt="" referrerpolicy="no-referrer" onerror="this.remove();this.parentNode&&0" ><span class="mono">'+m+'</span></div>'}
function lg(k,m){return '<div class="logo" data-m="'+m+'"><img src="'+L[k]+'" alt="" referrerpolicy="no-referrer"></div>'}
function fix(){document.querySelectorAll(".logo[data-m]").forEach(function(d){var i=d.querySelector("img");var f=function(){d.textContent=d.dataset.m};i.onerror=f;if(i.complete&&!i.naturalWidth)f()})}

function ed(a,b){return '<div class="item"><b>'+a+'</b><small>'+b+'</small></div>'}
function ex(a,b,l){return '<div class="item"><b>'+a+'</b><small>'+b+'</small><ul>'+l.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>'}
function tg(a){return '<div class="tags">'+a.map(function(s){return '<span>'+s+'</span>'}).join("")+'</div>'}

var views={
profile:function(){return '<div class="hero"><div class="av">RD</div><div><h2>Rahabu Mussa Dage</h2><div class="role">Accounting &amp; Finance Graduate</div><div class="meta"><span>📍 Kurasini, Dar es Salaam</span><span>📞 +255 613 230 937</span><span>✉️ mosesrahab703@gmail.com</span><span>Age 24 · Single</span></div></div></div>'+
'<div class="cols"><div class="stack">'+
'<div class="card"><h3>Professional Summary</h3><p style="margin:0;color:var(--mu)">Theoretical knowledge in accounting, taxation, auditing and public financial management, with basic computer and digital-marketing skills. A fast learner eager to help an organisation grow in a fast-moving business environment.</p></div>'+
'<div class="card"><h3>Experience</h3>'+
ex("Micro-Entrepreneurship","Personal Project, Dar es Salaam · 2025 – 2026",["Sold women’s accessories and cosmetics","Cash flow tracking and price negotiation","Maintained a profitable margin","Promoted personalised discounts and deals to win referrals"])+
ex("Volunteer","Tanzania Revenue Authority (TRA), Igunga – Tabora · 2023",["Maintained sales alignment and monitored market trends","Planned and hosted promotion events in local markets","Managed social media content and helped prepare the marketing budget"])+'</div>'+
'<div class="card"><h3>Education</h3>'+
ed("Diploma in Public Sector Accounting &amp; Finance","Tanzania Institute of Accountancy (TIA) · 2023")+
ed("Basic Technician Certificate in Public Sector Accounting &amp; Finance","Tanzania Institute of Accountancy (TIA) · 2021")+
ed("Certificate of Secondary Education (CSEE)","St. Thomas Aquinas Secondary School · 2018")+'</div>'+
'</div><div class="stack">'+
'<div class="card"><h3>Key Skills</h3>'+tg(["Public sector accounting","Taxation fundamentals","Financial risk assessment","Customer service &amp; office practice","Internal auditing &amp; controls","Financial statements"])+'</div>'+
'<div class="card"><h3>Digital Skills</h3>'+tg(["Data entry","Accounting software basics","Digital marketing tools","Basic computer applications","Online research"])+'</div>'+
'<div class="card"><h3>Referees</h3><div class="ref"><b>Dickson Msangi</b><small>Tax Officer, TRA Tabora – Igunga</small><small>+255 678 055 512</small></div><div class="ref"><b>Daniel Gasper</b><small>Moderator, Essence Technologies Kahama</small><small>+255 767 525 868 · essencetools@gmail.com</small></div></div>'+
'<div class="card"><h3>My CV</h3><div class="up"><span id="cvn">📄 '+cvName+'</span><input id="cvf" type="file" accept="application/pdf" class="hide"><button class="btn ghost" id="cvb">Upload new PDF</button></div></div>'+
'</div></div>'},
jobs:function(){return '<h1 class="ttl">Apply for Jobs</h1><p>Open positions from leading employers.</p><div class="jobs">'+jobs.map(function(j,n){return '<div class="card job"><div class="jh">'+lg(j.l,j.m)+'<div><h3>'+j.t+'</h3><div class="co">'+j.c+'</div></div></div><div class="req"><b>Requirements:</b> '+j.r+'</div><button class="btn ap">Apply</button></div>'}).join("")+'</div>'},
apps:function(){return '<h1 class="ttl">My Applications</h1><p>Track the progress of every job you have applied for.</p>'+apps.map(function(a){return '<div class="card app"><div class="jh">'+lg(a.l,a.m)+'<div><h3 style="margin:0;font-size:1.2rem">'+a.t+' · '+a.loc+'</h3><div class="co">'+a.c+'</div><div style="font-size:.88rem;color:var(--mu)">Requirements: '+a.r+'</div></div><span class="badge">Fully Approved</span></div><div class="steps">'+steps.map(function(s,i){var d=i<a.d;return '<div class="st'+(d?' done':'')+'"><i>'+(d?'✓':'')+'</i>'+s+'</div>'}).join("")+'</div></div>'}).join("")}
};
var $=function(id){return document.getElementById(id)};
function show(v){
  $("main").innerHTML=views[v]();fix();window.scrollTo(0,0);
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===v)});
  if(v==="profile"){$("cvb").onclick=function(){$("cvf").click()};$("cvf").onchange=function(){var x=this.files[0];if(x)$("cvn").textContent="📄 "+x.name}}
  if(v==="jobs"){document.querySelectorAll(".ap").forEach(function(b){b.onclick=function(){
    b.textContent="Deadline reached";b.classList.add("off");
    var t=$("toast");t.classList.remove("hide");setTimeout(function(){t.classList.add("hide")},2200)}})}
}
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");show("profile")}
$("lbtn").onclick=function(){
  if($("u").value.trim().toLowerCase()===USER&&$("p").value===PASS){try{sessionStorage.setItem("aj","1")}catch(e){}enter()}
  else $("err").textContent="Incorrect username or password."
};
$("p").onkeydown=function(e){if(e.key==="Enter")$("lbtn").click()};
$("nav").onclick=function(e){if(e.target.dataset.v)show(e.target.dataset.v)};
$("lo").onclick=function(){try{sessionStorage.removeItem("aj")}catch(e){}$("app").classList.add("hide");$("login").classList.remove("hide");$("p").value=""};
try{if(sessionStorage.getItem("aj")==="1")enter()}catch(e){}
</script>
</body>
</html>
